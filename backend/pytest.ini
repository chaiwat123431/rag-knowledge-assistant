[pytest]
# Without this, `import app...` in the test files only resolves when pytest
# happens to be invoked as `python -m pytest` from backend/ (which puts the
# CWD on sys.path as a side effect of -m). A plain `pytest` invocation from
# backend/ — the conventional command, and what CI is likely to run — fails
# collection with ModuleNotFoundError: No module named 'app'. `pythonpath = .`
# puts this file's directory (backend/) on sys.path regardless of how pytest
# is invoked.
pythonpath = .
