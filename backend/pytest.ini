[pytest]
# Without this, `import app...` in the test files only resolves when pytest
# happens to be invoked as `python -m pytest` from backend/ (which puts the
# CWD on sys.path as a side effect of -m). A plain `pytest` invocation from
# backend/ — the conventional command, and what CI is likely to run — fails
# collection with ModuleNotFoundError: No module named 'app'. `pythonpath = .`
# puts this file's directory (backend/) on sys.path regardless of how pytest
# is invoked.
pythonpath = .

# A plain `pytest` runs only the fast, hermetic tests. The `model`- and
# `ollama`-marked tests need external resources, so they are opt-in:
# `pytest -m model`, `pytest -m ollama`, or `pytest -m ""` for everything.
addopts = -m "not model and not ollama"
markers =
    model: test loads the real sentence-transformers model / Chroma (needs
        the ~90MB all-MiniLM-L6-v2 weights, downloaded from the Hugging
        Face hub on first run). Excluded by default (see addopts); run with
        `pytest -m model`.
    ollama: test calls a real local Ollama server (localhost:11434). Skips
        cleanly if it's not running or the model isn't pulled. Excluded by
        default; run with `pytest -m ollama`.
